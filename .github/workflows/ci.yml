# CPU checks for every pull request and every push to master.
#
# Hosted runners have no NVIDIA GPU, so CUDA-only tests skip here. GPU coverage
# is the manual production gate (tools/run_production_gate.py --include-gui),
# whose manifest is attached to each release; see docs/RELEASING.md.
name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Blender's bundled Python, so tests run on the interpreter the add-on ships to.
  PYTHON_VERSION: "3.13"
  # Hide any GPU so a runner with one behaves like the hosted fleet.
  CUDA_VISIBLE_DEVICES: "-1"

jobs:
  checks:
    name: Lint, tests and Warp CPU validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: fluidSim_warp_blender51/requirements-dev.txt
      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check -r fluidSim_warp_blender51/requirements-dev.txt
      - name: Lint
        working-directory: fluidSim_warp_blender51
        run: python -m ruff check .
      - name: Verify release metadata, Warp lock and delivery policy
        run: >-
          python tools/release/build_extension.py --verify-only
          --json-report dist/release-environment-report.json
      - name: Compile all Python modules
        run: python -m compileall -q -f fluidSim_warp_blender51 tools tests
      - name: Tests
        run: python -m pytest -q
      - name: Locate the installed Warp runtime
        run: >-
          echo "WARP_ROOT=$(python -c 'import pathlib, warp; print(pathlib.Path(warp.__file__).parents[1])')"
          >> "$GITHUB_ENV"
      - name: Validate whitewater kernels on Warp CPU
        run: >-
          python tools/release/validate_phase4_warp.py --expected-warp-root "$WARP_ROOT"
          --device cpu --report-json dist/phase4-warp-cpu-validation.json
      - name: Validate surface-tension kernels on Warp CPU
        run: >-
          python tools/release/validate_phase5_warp.py --expected-warp-root "$WARP_ROOT"
          --device cpu --report-json dist/phase5-warp-cpu-validation.json
      - name: Validate Custom Effects compilation and sandboxing on Warp CPU
        run: >-
          python tools/release/validate_custom_effects_warp.py --expected-warp-root "$WARP_ROOT"
          --device cpu --report-json dist/custom-effects-warp-cpu-validation.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-reports
          path: dist/*.json
          if-no-files-found: warn

  package:
    name: Build, install and smoke-test the extension
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # download.blender.org answers scripted downloads with a bot challenge, so
      # fetch from an official mirror and pin the checksum Blender publishes.
      BLENDER_VERSION: "5.1.0"
      BLENDER_SHA256: 7f2475990613c8d4c7ac5697803fcf40d09541c1fd8c23936f4b07a169a920c7
      BLENDER_MIRROR: https://mirrors.ocf.berkeley.edu/blender
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: fluidSim_warp_blender51/requirements-dev.txt
      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check -r fluidSim_warp_blender51/requirements-dev.txt
      - name: Restore Blender
        id: blender-cache
        uses: actions/cache@v6
        with:
          path: ~/blender-${{ env.BLENDER_VERSION }}-linux-x64.tar.xz
          key: blender-${{ env.BLENDER_VERSION }}-${{ env.BLENDER_SHA256 }}
      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          series="${BLENDER_VERSION%.*}"
          curl -fsSL --retry 3 -o ~/blender-${BLENDER_VERSION}-linux-x64.tar.xz \
            "${BLENDER_MIRROR}/release/Blender${series}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
      - name: Unpack Blender
        run: |
          echo "${BLENDER_SHA256}  $HOME/blender-${BLENDER_VERSION}-linux-x64.tar.xz" | sha256sum -c -
          tar -xf ~/blender-${BLENDER_VERSION}-linux-x64.tar.xz -C "$RUNNER_TEMP"
          echo "BLENDER=$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Install Blender runtime libraries
        run: >-
          sudo apt-get update -q &&
          sudo apt-get install -y -q --no-install-recommends
          libegl1 libgl1 libsm6 libxi6 libxkbcommon0 libxrender1 libxxf86vm1 libxfixes3
      - name: Provide the certified Warp runtime outside the package
        run: |
          warp_version="$(python -c 'import sys; sys.path.insert(0, "fluidSim_warp_blender51"); import version; print(version.CERTIFIED_WARP_VERSION)')"
          python -m pip install --disable-pip-version-check --no-deps \
            --target "$RUNNER_TEMP/external-warp-site" "warp-lang==${warp_version}"
          echo "PYTHONPATH=$RUNNER_TEMP/external-warp-site" >> "$GITHUB_ENV"
          echo "FLUIDSIM_EXTERNAL_WARP_ROOT=$RUNNER_TEMP/external-warp-site" >> "$GITHUB_ENV"
      - name: Build, validate, install, smoke-test and uninstall
        run: >-
          python tools/release/build_extension.py
          --blender "$BLENDER"
          --output dist
          --skip-python-checks --skip-lint
          --smoke-platform linux-x64
          --json-report dist/linux-build-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: extension-packages
          path: |
            dist/*.zip
            dist/*.json
            dist/SHA256SUMS.txt
          if-no-files-found: warn
