name: Warp Flow GH Archive forensics

on:
  push:
    branches:
      - forensics/warp-flow-014-gharchive
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Recover issue-comment events from GH Archive
        run: |
          set -euo pipefail
          python forensics/warp-flow-014-gharchive/recover.py evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warp-flow-gharchive-forensics
          path: evidence
          if-no-files-found: error
          retention-days: 30
