name: FluidSim release checks

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fluidsim-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static release foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify binary-free source metadata
        run: >-
          python release/build_extension.py --verify-only
          --json-report release-environment-report.json
      - name: Run pure-Python tests
        run: python -m pytest -q
      - name: Lint release modules
        run: python -m ruff check .
      - name: Compile all Python modules
        run: python -m compileall -q -f .
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: static-release-evidence
          path: release-environment-report.json
          if-no-files-found: warn

  blender-package:
    name: Blender 5.1 Linux validation and dual-platform package smoke test
    needs: static
    runs-on: [self-hosted, linux, x64, fluidsim-release]
    env:
      BLENDER: ${{ vars.BLENDER_5_1_EXECUTABLE }}
      WARP_WHEEL_SOURCE: ${{ vars.WARP_1_16_WHEEL_SOURCE }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Require certified local Blender and Warp inputs
        shell: bash
        run: |
          test -x "$BLENDER"
          test -e "$WARP_WHEEL_SOURCE"
      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Prepare external checksum-locked Warp validation runtime
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/external-warp-wheel" "$RUNNER_TEMP/external-warp-site"
          python release/fetch_warp_wheels.py --source "$WARP_WHEEL_SOURCE" --wheel-dir "$RUNNER_TEMP/external-warp-wheel" --offline
          mkdir -p "$RUNNER_TEMP/external-warp-site"
          python -m zipfile -e "$RUNNER_TEMP/external-warp-wheel/warp_lang-1.16.0+cu12-py3-none-manylinux_2_28_x86_64.whl" "$RUNNER_TEMP/external-warp-site"
          echo "PYTHONPATH=$RUNNER_TEMP/external-warp-site" >> "$GITHUB_ENV"
          echo "FLUIDSIM_EXTERNAL_WARP_ROOT=$RUNNER_TEMP/external-warp-site" >> "$GITHUB_ENV"
      - name: Validate Phase 4 whitewater kernels on Warp CPU
        shell: bash
        run: |
          python release/validate_phase4_warp.py \
            --expected-warp-root "$RUNNER_TEMP/external-warp-site" \
            --device cpu \
            --report-json dist/phase4-warp-cpu-validation.json
      - name: Validate Phase 5 surface-tension kernels on Warp CPU
        shell: bash
        run: |
          python release/validate_phase5_warp.py \
            --expected-warp-root "$RUNNER_TEMP/external-warp-site" \
            --device cpu \
            --report-json dist/phase5-warp-cpu-validation.json
      - name: Validate Custom Effects compilation and sandboxing on Warp CPU
        shell: bash
        run: |
          mkdir -p dist
          python release/validate_custom_effects_warp.py \
            --expected-warp-root "$RUNNER_TEMP/external-warp-site" \
            --device cpu \
            --report-json dist/custom-effects-warp-cpu-validation.json
      - name: Validate Custom Effects workflow and demos in Blender
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/fluidsim_ci_source"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/fluidsim_ci_source"
          PYTHONPATH="$RUNNER_TEMP:$RUNNER_TEMP/external-warp-site" \
          FLUIDSIM_EXTERNAL_WARP_ROOT="$RUNNER_TEMP/external-warp-site" \
          FLUIDSIM_ALLOW_EFFECT_CPU_VALIDATION=1 \
          "$BLENDER" --background --factory-startup --offline-mode \
            --python-use-system-env --python-exit-code 1 \
            --python release/validate_custom_effects_blender.py -- \
            --module fluidsim_ci_source \
            --examples resources/examples \
            --work-dir "$RUNNER_TEMP/custom-effects-blender" \
            --expected-warp-root "$RUNNER_TEMP/external-warp-site" \
            --device cpu \
            --report-json dist/custom-effects-blender-validation.json
      - name: Validate native Scene, Object, Preferences, and Custom Effects Properties UI
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/fluidsim_ci_source"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/fluidsim_ci_source"
          PYTHONPATH="$RUNNER_TEMP:$RUNNER_TEMP/external-warp-site" \
          FLUIDSIM_EXTERNAL_WARP_ROOT="$RUNNER_TEMP/external-warp-site" \
          "$BLENDER" --background --factory-startup --offline-mode \
            --python-use-system-env --python-exit-code 1 \
            --python release/validate_properties_ui_blender.py -- \
            --module fluidsim_ci_source \
            --work-dir "$RUNNER_TEMP/properties-ui-blender" \
            --expected-warp-root "$RUNNER_TEMP/external-warp-site" \
            --report-json dist/properties-ui-blender-validation.json
      - name: Build, inspect, install, reload, execute Warp, and uninstall
        shell: bash
        run: |
          python release/build_extension.py \
            --blender "$BLENDER" \
            --output dist \
            --smoke-platform linux-x64 \
            --json-report dist/linux-build-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fluidsim-dual-platform-packages
          path: |
            dist/fluidsim_warp-1.0.255-linux_x64.zip
            dist/fluidsim_warp-1.0.255-windows_x64.zip
            dist/SHA256SUMS.txt
            dist/linux-build-report.json
            dist/smoke-test-report.json
            dist/phase4-warp-cpu-validation.json
            dist/phase5-warp-cpu-validation.json
            dist/custom-effects-warp-cpu-validation.json
            dist/custom-effects-blender-validation.json
            dist/properties-ui-blender-validation.json
          if-no-files-found: error

  gpu-regression:
    name: NVIDIA GPU release regression
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: blender-package
    runs-on: [self-hosted, linux, x64, nvidia]
    env:
      BLENDER: ${{ vars.BLENDER_5_1_EXECUTABLE }}
      WARP_WHEEL_SOURCE: ${{ vars.WARP_1_16_WHEEL_SOURCE }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Require certified Blender, Warp, and NVIDIA runner inputs
        shell: bash
        run: |
          test -x "$BLENDER"
          test -e "$WARP_WHEEL_SOURCE"
          command -v nvidia-smi
      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Prepare external checksum-locked Warp validation runtime
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/external-warp-wheel" "$RUNNER_TEMP/external-warp-site"
          python release/fetch_warp_wheels.py --source "$WARP_WHEEL_SOURCE" --wheel-dir "$RUNNER_TEMP/external-warp-wheel" --offline
          mkdir -p "$RUNNER_TEMP/external-warp-site"
          python -m zipfile -e "$RUNNER_TEMP/external-warp-wheel/warp_lang-1.16.0+cu12-py3-none-manylinux_2_28_x86_64.whl" "$RUNNER_TEMP/external-warp-site"
          echo "PYTHONPATH=$RUNNER_TEMP/external-warp-site" >> "$GITHUB_ENV"
          echo "FLUIDSIM_EXTERNAL_WARP_ROOT=$RUNNER_TEMP/external-warp-site" >> "$GITHUB_ENV"
      - name: Validate Phase 4 whitewater kernels on CUDA
        shell: bash
        run: |
          python release/validate_phase4_warp.py \
            --expected-warp-root "$RUNNER_TEMP/external-warp-site" \
            --device cuda:0 \
            --report-json dist/phase4-warp-cuda-validation.json
      - name: Validate Phase 5 surface-tension kernels on CUDA
        shell: bash
        run: |
          python release/validate_phase5_warp.py \
            --expected-warp-root "$RUNNER_TEMP/external-warp-site" \
            --device cuda:0 \
            --report-json dist/phase5-warp-cuda-validation.json
      - name: Validate Custom Effects compilation, sandboxing, demos, and Blender workflow on CUDA
        shell: bash
        run: |
          mkdir -p dist
          python release/validate_custom_effects_warp.py \
            --expected-warp-root "$RUNNER_TEMP/external-warp-site" \
            --device cuda:0 \
            --report-json dist/custom-effects-warp-cuda-validation.json
          rm -f "$RUNNER_TEMP/fluidsim_ci_source"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/fluidsim_ci_source"
          PYTHONPATH="$RUNNER_TEMP:$RUNNER_TEMP/external-warp-site" \
          FLUIDSIM_EXTERNAL_WARP_ROOT="$RUNNER_TEMP/external-warp-site" \
          "$BLENDER" --background --factory-startup --offline-mode \
            --python-use-system-env --python-exit-code 1 \
            --python release/validate_custom_effects_blender.py -- \
            --module fluidsim_ci_source \
            --examples resources/examples \
            --work-dir "$RUNNER_TEMP/custom-effects-blender-cuda" \
            --expected-warp-root "$RUNNER_TEMP/external-warp-site" \
            --device cuda:0 \
            --report-json dist/custom-effects-blender-cuda-validation.json
      # build_extension invokes release/gpu_regression_blender.py inside the installed package.
      - name: Build and run all GPU validations plus ten preview frames
        shell: bash
        run: |
          python release/build_extension.py \
            --blender "$BLENDER" \
            --output dist \
            --gpu-regression-platform linux-x64 \
            --json-report dist/gpu-build-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gpu-regression-evidence
          path: |
            dist/gpu-regression-report.json
            dist/gpu-build-report.json
            dist/SHA256SUMS.txt
            dist/fluidsim_warp-1.0.253-linux_x64.zip
            dist/fluidsim_warp-1.0.253-windows_x64.zip
            dist/phase4-warp-cuda-validation.json
            dist/phase5-warp-cuda-validation.json
            dist/custom-effects-warp-cuda-validation.json
            dist/custom-effects-blender-cuda-validation.json
          if-no-files-found: warn
