schema_version = "1.0.0"

id = "fluidsim_warp"
name = "FluidSim Warp"
version = "3.2.1"
tagline = "Interactive CUDA liquid simulation for Blender"
maintainer = "FluidSim"
type = "add-on"

blender_version_min = "5.2.0"
license = ["SPDX:GPL-3.0-or-later"]
platforms = ["windows-x64", "linux-x64"]
tags = ["Physics"]

# NVIDIA Warp is installed from PyPI via a button in Add-on Preferences.
# The addon no longer bundles wheels; see tools/release/wheels.lock.json for
# the certified version and checksums.

[permissions]
files = "Read and write simulation caches, exports, and user presets"
network = "Download the certified NVIDIA Warp build from PyPI"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".*",
  "*.zip",
  "*.whl",
  "wheels/",
  "tests/",
  "demo_outputs/",
  "artifacts/",
  "pyproject.toml",
  "requirements-dev.txt",
  "build/",
  "dist/",
  "backlog/",
]
