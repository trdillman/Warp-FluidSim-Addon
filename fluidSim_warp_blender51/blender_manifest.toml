schema_version = "1.0.0"

id = "fluidsim_warp"
name = "FluidSim Warp"
version = "1.0.255"
tagline = "Interactive CUDA liquid simulation with beta ST-FLIP"
maintainer = "FluidSim"
type = "add-on"

blender_version_min = "5.1.0"
license = ["SPDX:GPL-3.0-or-later"]
platforms = ["windows-x64", "linux-x64"]
tags = ["Physics"]

[permissions]
files = "Read and write simulation caches, exports, and user presets"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".*",
  "*.zip",
  "*.whl",
  "wheels/",
  "tests/",
  "demo_outputs/",
  "artifacts/",
  "pyproject.toml",
  "requirements-dev.txt",
  "build/",
  "dist/",
]
