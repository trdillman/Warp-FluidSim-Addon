[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--rootdir=tests --import-mode=importlib -ra --strict-markers"
markers = [
  "cuda: needs a Warp CUDA device (auto-applied to tests using the cuda_device fixture; select with FLUIDSIM_TEST_DEVICE)",
  "blender: needs Blender's bpy module",
  "slow: long-running; deselect with -m \"not slow\"",
]

[tool.ruff]
target-version = "py313"
line-length = 100
include = [
  "release/*.py",
  "runtime/*.py",
  "tests/*.py",
  "version.py",
  "warp_discovery.py",
]
exclude = ["wheels", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
