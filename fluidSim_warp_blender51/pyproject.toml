[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--rootdir=tests --import-mode=importlib -ra"

[tool.ruff]
target-version = "py311"
line-length = 100
include = [
  "release/*.py",
  "runtime/*.py",
  "tests/*.py",
  "version.py",
  "warp_discovery.py",
]
exclude = ["wheels", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
