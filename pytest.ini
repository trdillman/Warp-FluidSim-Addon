[pytest]
pythonpath = .
testpaths =
    tests
    fluidSim_warp_blender51/tests
addopts = --strict-markers
markers =
    cuda: needs a Warp CUDA device (auto-applied to tests using the cuda_device fixture; select with FLUIDSIM_TEST_DEVICE)
    blender: needs Blender's bpy module
    slow: long-running; deselect with -m "not slow"
